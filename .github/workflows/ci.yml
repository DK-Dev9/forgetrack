name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forgetrack_test
          POSTGRES_USER: forgetrack_user
          POSTGRES_PASSWORD: forgetrack_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
          DJANGO_DEBUG: "False"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: forgetrack_test
          DB_USER: forgetrack_user
          DB_PASSWORD: forgetrack_secret_password
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: |
          pytest backend/tests -v

  frontend-check:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
